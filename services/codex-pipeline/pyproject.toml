[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hrs-codex"
version = "0.1.0"
description = "Local historical research evidence workflow for native Codex subagents"
requires-python = ">=3.11,<3.13"
dependencies = ["mcp==2.2.0", "Pillow>=11,<13", "pypdfium2>=5,<6", "pypdf>=6,<7", "filelock>=3.16,<4"]

[project.scripts]
hrs-codex = "hrs_codex.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hrs_codex = ["workflow.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"
