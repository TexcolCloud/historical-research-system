[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hrs-runtime"
version = "0.1.0"
description = "Small shared HTTP diagnostics for Historical Research System"
requires-python = ">=3.11"
dependencies = ["boto3>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend = "../../ruff.toml"
target-version = "py311"
line-length = 100
