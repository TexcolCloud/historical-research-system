name: historical-ingestion-acceptance

services:
  s3:
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    command: ["mini", "-dir=/data", "-webdav=false", "-admin.ui=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${INGEST_S3_ACCESS_KEY:?Set a dedicated S3 acceptance access key}
      AWS_SECRET_ACCESS_KEY: ${INGEST_S3_SECRET_KEY:?Set a dedicated S3 acceptance secret}
      S3_BUCKET: ${INGEST_S3_BUCKET:-ingestion-acceptance}
    ports:
      - "127.0.0.1:58333:8333"
    volumes:
      - s3-data:/data
  postgres:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: ingestion_owner
      POSTGRES_DB: ingestion_dev
      POSTGRES_PASSWORD: ${INGEST_DEV_DB_PASSWORD:?Set a dedicated local development password}
    ports:
      - "127.0.0.1:${INGEST_DEV_DB_PORT:-55436}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-ingestion-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion_owner -d ingestion_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  s3-data:
  postgres-data:
