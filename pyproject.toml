[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-research-system"
version = "0.2.0"
description = "Local historical source processing, independent native Codex review and research library"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.141.1,<0.142", "pydantic>=2.13.5,<3", "uvicorn>=0.35,<1",
  "SQLAlchemy>=2.0.52,<2.1", "psycopg[binary]>=3.3.5,<4", "alembic>=1.19.2,<2",
  "python-dotenv>=1,<2", "httpx>=0.28,<1", "mcp==2.2.0", "boto3>=1.40,<2",
  "pypdfium2>=5,<6", "pypdf>=6,<7", "filelock>=3.32,<4", "psutil>=7.2,<8",
  "Pillow>=11,<13", "tokenizers>=0.22,<0.23", "opensearch-py>=3,<4",
  "langchain-text-splitters>=0.3,<2", "markdown-it-py>=3,<5", "OpenCC>=1.1,<2",
]

[project.optional-dependencies]
retrieval = ["torch>=2.9,<3", "transformers==4.57.6", "numpy>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pdfplumber==0.11.10"]

[project.scripts]
hrs = "hrs.cli:main"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hrs.codex" = ["workflow.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
extend = "ruff.toml"
target-version = "py311"
line-length = 110
