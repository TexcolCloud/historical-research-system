# Dedicated, disposable CI storage. Does not mount any existing platform volumes.
name: hrs-platform-ci
services:
  postgres:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: hrs_test
      POSTGRES_PASSWORD: engineering-only
      POSTGRES_DB: historical_research_v2_test
    ports: ['127.0.0.1:55439:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrs_test -d historical_research_v2_test']
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    command: ['mini', '-dir=/data', '-webdav=false', '-admin.ui=false']
    environment:
      AWS_ACCESS_KEY_ID: engineering-only
      AWS_SECRET_ACCESS_KEY: engineering-only-secret
      S3_BUCKET: platform-ci
    ports: ['127.0.0.1:58339:8333']
