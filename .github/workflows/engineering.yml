name: Historical research checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  UV_LINK_MODE: copy
  UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
  PLATFORM_DATABASE_URL: postgresql+psycopg://hrs_test:engineering-only@127.0.0.1:55439/historical_research_v2_test
  PLATFORM_TEST_DATABASE_URL: postgresql+psycopg://hrs_test:engineering-only@127.0.0.1:55439/historical_research_v2_test
  PLATFORM_S3_ENDPOINT: http://127.0.0.1:18339
  PLATFORM_S3_BUCKET: platform-ci
  PLATFORM_S3_ACCESS_KEY: engineering-only
  PLATFORM_S3_SECRET_KEY: engineering-only-secret
  PLATFORM_OPENSEARCH_URL: http://127.0.0.1:19269
  PLATFORM_OPENSEARCH_INDEX: platform-ci-chunks

jobs:
  model-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.6'
          enable-cache: true
      - name: Install CPU adapter dependencies without model weights
        run: uv sync --locked --group dev --extra retrieval
      - name: Require the model adapter dependencies
        run: uv run --no-sync --locked python -c "from hrs.search.models import LocalModels"
      - name: Verify bounded batches, OOM recovery and complete input validation
        run: uv run --no-sync --locked pytest tests/integration/platform/test_retrieval_batching.py -q --junitxml=reports/model-adapters.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-adapter-checks
          path: reports/model-adapters.xml
          retention-days: 14
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Keep local auxiliary files out of Git
        shell: bash
        run: |
          tracked_ignored=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            printf 'Tracked files violate .gitignore:\n%s\n' "$tracked_ignored"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/tooling/openapi/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.6'
          enable-cache: true
      - name: Install the unified Python environment
        run: uv sync --locked --group dev
      - run: npm --prefix web ci
      - run: npm --prefix web/tooling/openapi ci
      - name: Start isolated test storage
        run: docker compose --project-name hrs-platform-ci -f deploy/compose.test.yml up -d --wait
      - name: Wait for the isolated object store
        run: uv run --no-sync --locked python -m hrs check-test-infra
      - name: Lint Python source and tests
        run: uv run --no-sync --locked ruff check src tests
      - name: Build the Python distribution
        run: |
          # Build the wheel from a fresh sdist; checkout build/lib may retain deleted modules.
          uv build
          wheel=$(find "$PWD/dist" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          printf 'HRS_TEST_WHEEL=%s\n' "$wheel" >> "$GITHUB_ENV"
      - name: Verify application and native MCP contracts without model credentials
        run: uv run --no-sync --locked pytest tests/unit tests/integration --basetemp "${{ runner.temp }}/hrs-tests" --junitxml=reports/tests.xml
      - name: Verify generated API contracts
        run: |
          npm --prefix web run contracts
          git diff --exit-code -- web/openapi.json web/src/client/schema.d.ts
      - run: npm --prefix web test
      - run: npm --prefix web run check-unused
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-checks
          path: |
            reports/tests.xml
            dist/*.whl
            web/dist/
          retention-days: 14
      - name: Stop isolated test storage
        if: always()
        run: docker compose --project-name hrs-platform-ci -f deploy/compose.test.yml down
